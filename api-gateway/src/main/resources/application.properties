server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/gateway/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1